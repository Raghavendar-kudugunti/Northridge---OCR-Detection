[project]
name = "northbridge-kyc"
version = "1.1.0"
requires-python = ">=3.12"
# Mirrors backend/requirements.txt (keep both in sync); pip users can keep using that file.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "pillow>=11,<13",
    "opencv-python-headless>=4.10,<5",
    "pymupdf>=1.24,<2",
    "docling>=2.142,<3",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "rapidocr>=3.4,<4",
    "httpx>=0.27,<1",
    "cryptography>=42,<60",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
# Supply-chain hardening: never resolve a package version published after this date, so
# newly published (possibly malicious) releases get time to be detected and yanked first.
# Move it forward deliberately (e.g. weekly). For an urgent security fix, override once:
#   uv lock --exclude-newer 2026-11-06T00:00:00Z
exclude-newer = "2026-10-30T00:00:00Z"
