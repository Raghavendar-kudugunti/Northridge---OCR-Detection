<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Northbridge document verification workflow</title>
  <desc id="desc">Borrowers submit identity and salary documents. The service extracts and checks the data, then either asks for corrected documents, automatically approves a verified application, or sends it to lender review.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:#f7f8fc}.card{fill:#fff;stroke:#d9deea;stroke-width:2}.blue{fill:#eef3ff;stroke:#6374d9}.green{fill:#edf9f1;stroke:#39a56a}.amber{fill:#fff5e6;stroke:#db912a}.purple{fill:#f4efff;stroke:#8c69d1}.title{font:700 22px Arial,sans-serif;fill:#17223b}.body{font:16px Arial,sans-serif;fill:#35415a}.small{font:14px Arial,sans-serif;fill:#56627a}.edge{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.caption{font:700 14px Arial,sans-serif;fill:#536079}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="760" rx="18"/>
  <text x="40" y="48" class="title">Northbridge document verification</text>
  <text x="40" y="76" class="small">Borrower submission, automated checks, approval or lender review</text>

  <rect class="card blue" x="45" y="125" width="235" height="120" rx="14"/>
  <text x="68" y="163" class="title">1 - Borrower uploads</text>
  <text x="68" y="193" class="body">ID card or PAN card</text>
  <text x="68" y="218" class="body">Salary slip; bank optional</text>

  <rect class="card blue" x="335" y="125" width="250" height="120" rx="14"/>
  <text x="358" y="163" class="title">2 - Submit application</text>
  <text x="358" y="193" class="body">Files stored securely</text>
  <text x="358" y="218" class="body">Processing starts</text>

  <rect class="card purple" x="640" y="115" width="280" height="140" rx="14"/>
  <text x="663" y="153" class="title">3 - Extract and validate</text>
  <text x="663" y="183" class="body">PDF text / Docling / OCR</text>
  <text x="663" y="208" class="body">Document type + required fields</text>
  <text x="663" y="233" class="body">PII masking before optional LLM</text>

  <path class="edge" d="M280 185 H325"/><path class="edge" d="M585 185 H630"/>

  <polygon points="780,310 920,385 780,460 640,385" fill="#fff" stroke="#9aa6ba" stroke-width="2"/>
  <text x="780" y="373" text-anchor="middle" class="title">Required files</text>
  <text x="780" y="400" text-anchor="middle" class="body">readable and complete?</text>
  <path class="edge" d="M780 255 V300"/>

  <rect class="card amber" x="60" y="330" width="330" height="130" rx="14"/>
  <text x="84" y="370" class="title">Action needed</text>
  <text x="84" y="401" class="body">See the exact missing or unreadable</text>
  <text x="84" y="426" class="body">field, replace the file, then resubmit.</text>
  <path class="edge" d="M640 385 H410"/>
  <text x="502" y="366" class="caption">NO</text>
  <path class="edge" d="M225 330 V280 H460 V255"/>
  <text x="237" y="293" class="caption">correct and resubmit</text>

  <rect class="card blue" x="640" y="490" width="280" height="135" rx="14"/>
  <text x="663" y="528" class="title">4 - Compare identity</text>
  <text x="663" y="558" class="body">Name: ID vs salary slip</text>
  <text x="663" y="583" class="body">PAN card: number vs payslip</text>
  <text x="663" y="608" class="body">Check verified identity duplicates</text>
  <path class="edge" d="M780 460 V480"/>
  <text x="797" y="477" class="caption">YES</text>

  <polygon points="780,640 920,685 780,730 640,685" fill="#fff" stroke="#9aa6ba" stroke-width="2"/>
  <text x="780" y="680" text-anchor="middle" class="title">All checks pass?</text>
  <text x="780" y="703" text-anchor="middle" class="body">No duplicate or review flag</text>
  <path class="edge" d="M780 625 V630"/>

  <rect class="card green" x="980" y="490" width="190" height="95" rx="14"/>
  <text x="1001" y="528" class="title">Approved</text>
  <text x="1001" y="558" class="body">Automatic approval</text>

  <rect class="card amber" x="980" y="615" width="190" height="105" rx="14"/>
  <text x="1001" y="653" class="title">Lender review</text>
  <text x="1001" y="683" class="body">Mismatch / duplicate</text>
  <text x="1001" y="705" class="small">or manual confirmation</text>

  <path class="edge" d="M920 685 H950 V538 H970"/>
  <text x="930" y="665" class="caption">YES</text>
  <path class="edge" d="M920 685 H950 V668 H970"/>
  <text x="930" y="710" class="caption">NO</text>
</svg>
